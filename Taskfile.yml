version: "3"

# This repo is a Nix flake that builds a self-contained Neovim (plugins + config
# + tree-sitter parsers + language tooling in one `nvim`). These tasks are thin
# wrappers over `nix`; every task requires Nix with flakes available.

vars:
  NIX_FLAGS: --extra-experimental-features 'nix-command flakes'

tasks:
  build:
    desc: Build the self-contained nvim (./result/bin/nvim)
    cmds:
      - nix build .# {{.NIX_FLAGS}}

  run:
    desc: Launch the packaged nvim
    cmds:
      - nix run .# {{.NIX_FLAGS}} -- {{.CLI_ARGS}}

  install:
    desc: Install the packaged nvim into your nix profile
    cmds:
      - nix profile install .# {{.NIX_FLAGS}}

  check:
    desc: Evaluate all flake outputs (nix flake check)
    cmds:
      - nix flake check {{.NIX_FLAGS}}

  update:
    desc: Update all flake inputs (refreshes flake.lock)
    cmds:
      - nix flake update {{.NIX_FLAGS}}

  fmt:
    desc: Format all Lua and Nix files
    cmds:
      - >-
        nix develop {{.NIX_FLAGS}} --command sh -c
        'stylua . && nixfmt flake.nix modules/*.nix'

  lint:
    desc: Check formatting without modifying files
    cmds:
      - >-
        nix develop {{.NIX_FLAGS}} --command sh -c
        'stylua --check . && nixfmt --check flake.nix modules/*.nix'

  test:
    desc: Run luacheck and actionlint
    cmds:
      - >-
        nix develop {{.NIX_FLAGS}} --command sh -c
        'luacheck lua/ colors/ && actionlint'

  ts-test:
    desc: Verify the prebuilt tree-sitter parser pack loads with no compiler on PATH
    cmds:
      - ./scripts/ts-smoke.sh
